openapi: 3.0.3
info:
  title: ForgePilot 业务后端 API
  version: 0.1.0
  description: |
    制造领航 ForgePilot 第一版业务接口契约（设备、告警、工单）。
    - 所有业务接口按登录组织隔离；跨组织资源统一返回 404。
    - 列表接口统一分页，返回 `items/page/pageSize/total/totalPages`。
    - 资源对外标识使用业务编码（设备编号、告警号、工单号），与前端 `frontend/src/data.js` 字段对齐。
    - 错误统一为 `{"error": {"code", "message", "details", "requestId"}}`。
    - 契约状态：诊断、审计与工单来源字段为本轮 v0.1 **待确认契约**，需与 C 联调确认后冻结。
    - `/api/v1/chat` 仍是 mock，不代表已持久化；持久化诊断请使用 `/api/v1/diagnoses`。
servers:
  - url: http://127.0.0.1:8000
    description: 本地开发
tags:
  - name: devices
    description: 设备
  - name: alerts
    description: 告警
  - name: work-orders
    description: 维护工单
  - name: diagnoses
    description: 诊断结果与人工确认
  - name: audit
    description: 审计事件查询
  - name: maintenance
    description: 设备历史（工单完成回写）
  - name: device-parameters
    description: 设备参数 CRUD
  - name: faults
    description: 设备历史故障链路
  - name: auth
    description: 登录与当前会话
security:
  - bearerAuth: []
  - organizationId: []
    userId: []
paths:
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备列表
      description: |
        权限：组织内任意有效成员（viewer 及以上）。
        支持分页、按工厂/状态/类型筛选和关键字搜索。已软删除设备不返回。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: plantId
          in: query
          required: false
          description: 工厂编码（plants.code）
          schema: { type: string, example: PLANT-SH-01 }
        - name: state
          in: query
          required: false
          description: 设备状态（中文枚举，与前端 data.js 一致）
          schema: { $ref: '#/components/schemas/DeviceState' }
        - name: type
          in: query
          required: false
          schema: { type: string, example: 动力与流体机械 }
        - name: q
          in: query
          required: false
          description: 按设备编号或名称模糊搜索
          schema: { type: string, example: AC-07 }
        - name: sort
          in: query
          required: false
          description: 排序字段，前缀 - 表示倒序
          schema: { type: string, enum: [code, -code, health, -health, updatedAt, -updatedAt], default: -updatedAt }
      responses:
        '200':
          description: 设备分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
              example:
                items:
                  - id: AC-07
                    name: 螺杆空气压缩机
                    type: 动力与流体机械
                    location: 压缩站 Bay03
                    health: 72.4
                    state: 需关注
                    alert: 1
                  - id: CNC-04
                    name: 数控龙门铣床
                    type: 精密加工单元
                    location: 重载加工岛 #3
                    health: 41
                    state: 告警异常
                    alert: 2
                page: 1
                pageSize: 20
                total: 5
                totalPages: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/devices/{device_id}:
    get:
      tags: [devices]
      operationId: getDevice
      summary: 设备详情
      description: 权限：组织内任意有效成员。跨组织设备返回 404。
      parameters:
        - name: device_id
          in: path
          required: true
          description: 设备编号（devices.code）
          schema: { type: string, example: AC-07 }
      responses:
        '200':
          description: 设备详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDetail' }
              example:
                id: AC-07
                name: 螺杆空气压缩机
                type: 动力与流体机械
                location: 压缩站 Bay03
                health: 72.4
                state: 需关注
                alert: 1
                plantId: PLANT-SH-01
                model: GX11
                serialNumber: SN-DEMO-0007
                createdAt: '2026-10-17T09:44:16+08:00'
                updatedAt: '2026-10-17T09:44:16+08:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 告警列表
      description: 权限：组织内任意有效成员。默认按发生时间倒序。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: level
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AlertLevel' }
        - name: deviceId
          in: query
          required: false
          description: 设备编号
          schema: { type: string, example: AC-07 }
        - name: q
          in: query
          required: false
          description: 按告警编号或标题搜索
          schema: { type: string, example: 轴承 }
      responses:
        '200':
          description: 告警分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
              example:
                items:
                  - id: ALT-0941
                    level: 一级紧急
                    title: 驱动端轴承高频振动 RMS 严重突破警戒上限
                    device: AC-07 螺杆空气压缩机
                    time: '2026-10-17T09:00:00+08:00'
                    owner: 张工
                    status: 待确认
                  - id: ALT-0938
                    level: 二级警告
                    title: 排气温度连续接近预警阈值
                    device: P-102 高压离心注水泵
                    time: '2026-10-17T08:44:00+08:00'
                    owner: 王强
                    status: 处理中
                page: 1
                pageSize: 20
                total: 4
                totalPages: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      tags: [alerts]
      operationId: acknowledgeAlert
      summary: 确认告警
      description: |
        权限：technician 及以上（technician/manager/admin/owner）。
        幂等：重复确认已确认告警返回 200，不重复写审计。
        已关闭告警返回 409。
      parameters:
        - name: alert_id
          in: path
          required: true
          description: 告警编号（alerts.code）
          schema: { type: string, example: ALT-0941 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertAcknowledgeRequest' }
            example: { note: 已到现场核实，准备停机检查。 }
      responses:
        '200':
          description: 确认后的告警
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
              example:
                id: ALT-0941
                level: 一级紧急
                title: 驱动端轴承高频振动 RMS 严重突破警戒上限
                device: AC-07 螺杆空气压缩机
                time: '2026-10-17T09:00:00+08:00'
                owner: 张工
                status: 已确认
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 告警已关闭，不能确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INVALID_STATE
                  message: 告警已关闭，不能再次确认
                  details: { alertId: ALT-0911, status: 已关闭 }
                  requestId: 0f7a2c1e
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/work-orders:
    get:
      tags: [work-orders]
      operationId: listWorkOrders
      summary: 工单列表
      description: 权限：组织内任意有效成员。默认按更新时间倒序。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WorkOrderStatus' }
        - name: priority
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WorkOrderPriority' }
        - name: ownerId
          in: query
          required: false
          description: 负责人用户 ID（users.id）
          schema: { type: string, format: uuid }
        - name: deviceId
          in: query
          required: false
          description: 设备编号
          schema: { type: string, example: AC-07 }
        - name: q
          in: query
          required: false
          description: 按工单号或标题搜索
          schema: { type: string, example: 轴承 }
      responses:
        '200':
          description: 工单分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderPage' }
              example:
                items:
                  - id: WO-20250518-01
                    title: AC-07 驱动端深沟球轴承紧急更换与润滑脂加注
                    priority: P1 紧急
                    owner: 张工
                    status: 处理中
                    updated: '2026-10-17T09:36:00+08:00'
                  - id: WO-20250518-02
                    title: P-102 机械密封泄漏检查
                    priority: P2 高
                    owner: 王强
                    status: 待验收
                    updated: '2026-10-17T09:19:00+08:00'
                page: 1
                pageSize: 20
                total: 4
                totalPages: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [work-orders]
      operationId: createWorkOrder
      summary: 创建工单
      description: 权限：manager 及以上（manager/admin/owner）。设备必须属于当前组织且未删除，否则 404。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderCreate' }
            example:
              title: AC-07 驱动端轴承检查
              deviceId: AC-07
              priority: P1 紧急
              description: 振动 RMS 超限，需停机检查轴承。
              ownerId: 00000000-0000-4000-8000-000000000102
              dueAt: '2026-10-17T18:00:00+08:00'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
              example:
                id: WO-20261017-01
                title: AC-07 驱动端轴承检查
                priority: P1 紧急
                owner: 张工
                status: 待处理
                updated: '2026-10-17T10:02:00+08:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 工单号冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: CONFLICT
                  message: 工单号已存在
                  details: { code: WO-20261017-01 }
                  requestId: 7b2e9d10
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/work-orders/{work_order_id}:
    patch:
      tags: [work-orders]
      operationId: updateWorkOrder
      summary: 更新工单
      description: |
        权限：technician 及以上。
        合法状态流转：待处理→处理中/已取消；处理中→待验收/已取消；待验收→已完成/处理中；已完成、已取消为终态。
        非法流转返回 409。
      parameters:
        - name: work_order_id
          in: path
          required: true
          description: 工单号（work_orders.code）
          schema: { type: string, example: WO-20250518-01 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderUpdate' }
            example:
              status: 待验收
              ownerId: 00000000-0000-4000-8000-000000000102
              description: 已完成轴承更换与润滑脂加注，等待验收。
      responses:
        '200':
          description: 更新后的工单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
              example:
                id: WO-20250518-01
                title: AC-07 驱动端深沟球轴承紧急更换与润滑脂加注
                priority: P1 紧急
                owner: 张工
                status: 待验收
                updated: '2026-10-17T10:15:00+08:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 非法状态流转
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INVALID_TRANSITION
                  message: 工单状态不能从 已完成 流转到 处理中
                  details: { from: 已完成, to: 处理中 }
                  requestId: c1d2e3f4
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diagnoses:
    get:
      tags: [diagnoses]
      operationId: listDiagnoses
      summary: 诊断列表
      description: 权限：组织内任意有效成员。按更新时间倒序，支持按状态/设备/关键字筛选。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 诊断状态（代码或中文标签）
          schema: { type: string, enum: [draft, confirmed, rejected, 草稿, 已确认, 已拒绝] }
        - name: deviceId
          in: query
          required: false
          description: 设备编号
          schema: { type: string, example: AC-07 }
        - name: q
          in: query
          required: false
          description: 按诊断编号、问题或结论搜索
          schema: { type: string, example: 轴承 }
      responses:
        '200':
          description: 诊断分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosisPage' }
              example:
                items:
                  - id: DIAG-20261017-01
                    deviceId: AC-07
                    question: AC-07 振动突然升高，可能是什么原因？
                    conclusion: 疑似驱动端轴承磨损，建议停机检查。
                    riskLevel: 高
                    status: draft
                    statusLabel: 草稿
                    modelSource: demo-model-v1
                    confirmedBy: null
                    confirmedAt: null
                    workOrderId: null
                page: 1
                pageSize: 20
                total: 1
                totalPages: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [diagnoses]
      operationId: createDiagnosis
      summary: 保存诊断结果
      description: |
        权限：technician 及以上。
        保存设备、组织、输入问题、诊断结论、证据引用快照、模型来源和状态（draft）。
        保存后可通过 GET 接口刷新查询。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisCreate' }
            example:
              deviceId: AC-07
              question: AC-07 振动突然升高，可能是什么原因？
              conclusion: 疑似驱动端深沟球轴承磨损，建议停机检查并更换。
              riskLevel: high
              confidence: 94.6
              modelSource: demo-model-v1
              evidence:
                documents:
                  - name: Atlas_Copco_GX11_UserManual_RevC.pdf
                    version: RevC
                    page: 42
                    score: 0.946
      responses:
        '201':
          description: 已保存的诊断（draft）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnosis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diagnoses/{diagnosis_id}:
    get:
      tags: [diagnoses]
      operationId: getDiagnosis
      summary: 诊断详情
      description: 权限：组织内任意有效成员。跨组织诊断返回 404；刷新后可查询已持久化字段。
      parameters:
        - name: diagnosis_id
          in: path
          required: true
          schema: { type: string, example: DIAG-20261017-01 }
      responses:
        '200':
          description: 诊断详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diagnosis' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diagnoses/{diagnosis_id}/confirm:
    post:
      tags: [diagnoses]
      operationId: confirmDiagnosis
      summary: 人工确认并生成工单
      description: |
        权限：technician 及以上。
        必须由登录用户显式确认，记录 confirmedBy / confirmedAt 和审计轨迹。
        确认后在同一事务中创建并关联一条工单；重复确认幂等，不会重复建单。
        任一步失败整体回滚，不会留下半条诊断或孤立工单；未确认诊断不能通过工单接口建单。
      parameters:
        - name: diagnosis_id
          in: path
          required: true
          schema: { type: string, example: DIAG-20261017-01 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosisConfirm' }
            example:
              title: AC-07 驱动端轴承检查
              priority: P1 紧急
              note: 已现场确认，同意建单
      responses:
        '200':
          description: 确认后的诊断与关联工单（重复调用返回同一工单）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosisConfirmation' }
              example:
                diagnosis:
                  id: DIAG-20261017-01
                  deviceId: AC-07
                  status: confirmed
                  statusLabel: 已确认
                  confirmedBy: 张工
                  confirmedAt: '2026-10-17T10:30:00+08:00'
                  workOrderId: WO-20261017-01
                workOrder:
                  id: WO-20261017-01
                  title: AC-07 驱动端轴承检查
                  priority: P1 紧急
                  owner: null
                  status: 待处理
                  updated: '2026-10-17T10:30:00+08:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 诊断已拒绝或状态不允许确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INVALID_STATE
                  message: 诊断已拒绝，不能确认
                  details: { diagnosisId: DIAG-20261017-01, status: rejected }
                  requestId: f1a2b3c4
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: 审计事件查询
      description: |
        权限：manager 及以上。
        按登录组织隔离，返回操作人、动作、实体、时间和结果。
        本路径为 v0.1 待确认契约。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          required: false
          schema: { type: string, example: diagnosis.confirm }
        - name: entityType
          in: query
          required: false
          schema: { type: string, example: diagnosis }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: actorId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: q
          in: query
          required: false
